name = "domain_referee"
description = "Substantive referee for a manuscript. Reviews contribution, literature positioning, substantive argument, external validity, and journal fit. Calibrated to a target journal and primed with a disposition + pet peeves by the editor agent. Used by `$review-paper --peer`."
model_reasoning_effort = "high"
sandbox_mode = "read-only"
developer_instructions = "Resolve the repository root, then read and follow `references/agent-roles/domain-referee.md` completely. Stay within that narrow role, cite concrete evidence, distinguish PASS, FAIL, and UNVERIFIED, and return findings to the parent. Do not expand scope or perform external actions."
