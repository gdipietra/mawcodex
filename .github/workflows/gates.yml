name: stable-gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MAWCODEX_SOURCE_CLONE: ${{ github.workspace }}/.source-baseline
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out the fixed source fork
        uses: actions/checkout@v7
        with:
          repository: gdipietra/claude-code-my-workflow
          ref: main
          fetch-depth: 0
          path: .source-baseline
          persist-credentials: false
      - name: Configure Pedro upstream
        working-directory: .source-baseline
        run: |
          git remote add upstream https://github.com/pedrohcgs/claude-code-my-workflow.git
          git fetch upstream main --no-tags
          git fetch origin tag v2.1.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Provision official Codex skill validator
        run: |
          python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3
          python scripts/provision_codex_skill_validator.py "${{ runner.temp }}/mawcodex-quick_validate.py"
      - name: Verify source clone contract
        run: python scripts/check_source_clone.py .source-baseline
      - name: Validate portable stable evidence
        run: python scripts/validate_package.py --release
      - name: Run packaged skill validators
        run: python scripts/run_skill_validators.py --validator "${{ runner.temp }}/mawcodex-quick_validate.py"

      - name: Validate public site identity
        run: python scripts/validate_public_site.py

      - name: Run behavioral tests
        run: python -m unittest discover -v
